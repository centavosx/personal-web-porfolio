# Local development only: Supabase (database, REST API, auth) and an
# S3-compatible stand-in for Cloudflare R2.
#
# Every value here is a throwaway local default. Production uses the real
# Supabase project and R2 bucket.
#
# Config files are built into the images instead of bind mounted, so this works
# without giving Docker access to the Documents folder. After adding a migration:
#   docker compose up -d --build
name: portfolio-local

x-postgres-password: &postgres-password local-dev-postgres-password
# Supabase's published demo secret. Only ever valid against this local stack.
x-jwt-secret: &jwt-secret super-secret-jwt-token-with-at-least-32-characters-long

services:
  db:
    build:
      context: ./docker/supabase
      dockerfile_inline: |
        FROM supabase/postgres:17.6.1.136
        COPY roles.sql /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
    restart: unless-stopped
    ports:
      - "54322:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_DB: postgres
      POSTGRES_PORT: 5432
      PGPORT: 5432
      PGDATABASE: postgres
      PGPASSWORD: *postgres-password
      POSTGRES_PASSWORD: *postgres-password
      JWT_EXP: 3600
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies supabase/migrations and supabase/seed.sql once each, then exits.
  db-migrate:
    build:
      context: ./supabase
      additional_contexts:
        scripts: ./docker/supabase
      dockerfile_inline: |
        FROM supabase/postgres:17.6.1.136
        COPY --from=scripts migrate.sh /migrate.sh
        COPY . /supabase
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: *postgres-password
    entrypoint: ["sh", "/migrate.sh"]

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:local-dev-postgres-password@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: *jwt-secret
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:local-dev-postgres-password@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_JWT_SECRET: *jwt-secret
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  # Serves /rest/v1 and /auth/v1 on one port, the way a Supabase project URL does.
  gateway:
    build:
      context: ./docker/supabase
      dockerfile_inline: |
        FROM nginx:1.27-alpine
        COPY nginx.conf /etc/nginx/conf.d/default.conf
    restart: unless-stopped
    depends_on:
      rest:
        condition: service_started
      auth:
        condition: service_healthy
    ports:
      - "54321:80"

  # MinIO speaks the same S3 API as R2. Ports 9100 and 9101 avoid the default 9000.
  r2:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER: r2-local-access-key
      MINIO_ROOT_PASSWORD: r2-local-secret-key
      # R2 signs requests with the region "auto".
      MINIO_SITE_REGION: auto
    volumes:
      - r2-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the bucket with public reads, like an R2 bucket with a public URL.
  r2-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      r2:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >
        mc alias set local http://r2:9000 r2-local-access-key r2-local-secret-key &&
        mc mb --ignore-existing local/portfolio &&
        mc anonymous set download local/portfolio

volumes:
  db-data:
  db-config:
  r2-data:
